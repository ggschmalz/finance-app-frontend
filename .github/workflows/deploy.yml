name: Deploy Frontend to Amazon ECR & EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: finance-app-frontend

jobs:
  # =========================================================================
  # JOB 1: Quality Gate E2E (Pré-requisito obrigatório)
  # =========================================================================
  test-e2e:
    name: Run E2E Test Suite (Quality Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Frontend Code
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout Test Automation Code
        uses: actions/checkout@v4
        with:
          repository: ggschmalz/finance-app-test-automation
          token: ${{ secrets.GH_PAT_ACTIONS || github.token }}
          path: test-automation

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            test-automation/package-lock.json

      # ---------------------------------------------------------------------
      # 1. Compilar e Subir o Frontend Localmente
      # ---------------------------------------------------------------------
      - name: Install Frontend Dependencies & Start Preview Server
        working-directory: frontend
        env:
          VITE_API_URL: "/api"
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build
          # Sobe o servidor de preview na porta 5173 em segundo plano
          npx vite preview --port 5173 &
          # Aguarda o servidor responder com timeout de 30 segundos
          npx wait-on http://localhost:5173 --timeout 30000

      # ---------------------------------------------------------------------
      # 2. Instalar Playwright e Executar Bateria de Testes
      # ---------------------------------------------------------------------
      - name: Install Automation Dependencies & Browsers
        working-directory: test-automation
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Execute E2E Tests
        working-directory: test-automation
        env:
          BASE_URL: "http://localhost:5173"
          CI: "true"
        run: npx playwright test

      # ---------------------------------------------------------------------
      # 3. Preservação de Evidências em Caso de Erro
      # ---------------------------------------------------------------------
      - name: Upload Playwright Report & Traces on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: test-automation/playwright-report/
          retention-days: 14

  # =========================================================================
  # JOB 2: Build da Imagem Docker e Deploy na AWS
  # =========================================================================
  build-and-deploy:
    name: Build, Push Image & Trigger EC2
    needs: [test-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_API_URL: "/api"
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          docker build \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            --build-arg VITE_GOOGLE_CLIENT_ID="$VITE_GOOGLE_CLIENT_ID" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Trigger EC2 Deploy via AWS SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "cd /home/ubuntu/app",
              "aws ecr get-login-password --region '${AWS_REGION}' | docker login --username AWS --password-stdin '${ECR_REGISTRY}'",
              "docker compose pull frontend",
              "docker compose up -d frontend"
            ]' \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "Comando SSM disparado: $COMMAND_ID. Aguardando execução..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          echo "Deploy do Frontend concluído com sucesso!"
