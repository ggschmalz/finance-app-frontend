name: Deploy Frontend to Amazon ECR & EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Filtro específico de teste (opcional, ex: auth.spec.ts)'
        required: false
        default: ''

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: finance-app-frontend

permissions:
  contents: write
  pull-requests: write

jobs:
  # =========================================================================
  # JOB 1: Quality Gate E2E com Orquestrador Multiagente de Self-Healing
  # =========================================================================
  test-e2e:
    name: Run E2E Test Suite & Multi-Agent Self-Healing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Frontend Code
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: 📚 Checkout Product Ground Truth (Base da Verdade)
        uses: actions/checkout@v4
        with:
          repository: ggschmalz/finance-app-product
          token: ${{ secrets.GH_PAT_ACTIONS || github.token }}
          path: finance-app-product

      - name: 🧪 Checkout Test Automation Code
        uses: actions/checkout@v4
        with:
          repository: ggschmalz/finance-app-test-automation
          token: ${{ secrets.GH_PAT_ACTIONS || github.token }}
          path: finance-app-test-automation

      - name: 🤖 Checkout Self-Healing Framework
        uses: actions/checkout@v4
        with:
          repository: ggschmalz/finance-self-healing-framework
          token: ${{ secrets.GH_PAT_ACTIONS || github.token }}
          path: finance-self-healing-framework

      - name: 🐍 Setup Python (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: finance-self-healing-framework/requirements.txt

      - name: 📦 Instalar Dependências do Sistema de Self-Healing
        run: |
          python -m pip install --upgrade pip
          pip install -r finance-self-healing-framework/requirements.txt

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            finance-app-test-automation/package-lock.json

      # ---------------------------------------------------------------------
      # 1. Compilar e Subir o Frontend Localmente
      # ---------------------------------------------------------------------
      - name: 🌐 Subir Servidor de Preview do Frontend
        working-directory: frontend
        env:
          VITE_API_URL: "/api"
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build
          # Sobe o servidor de preview na porta 5173 em segundo plano
          npx vite preview --port 5173 &
          # Aguarda o servidor responder com timeout de 30 segundos
          npx wait-on http://localhost:5173 --timeout 30000

      # ---------------------------------------------------------------------
      # 2. Instalar Playwright e Navegadores
      # ---------------------------------------------------------------------
      - name: 📦 Instalar Dependências do Playwright
        working-directory: finance-app-test-automation
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # ---------------------------------------------------------------------
      # 3. Execução dos Testes com Orquestrador de Self-Healing (Quality Gate)
      # ---------------------------------------------------------------------
      - name: 🚀 Executar Suíte E2E com Orquestrador de Self-Healing
        id: self_healing_e2e
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          BASE_DIR: ${{ github.workspace }}
          AUTOMATION_DIR: ${{ github.workspace }}/finance-app-test-automation
          PRODUCT_DIR: ${{ github.workspace }}/finance-app-product
          GITHUB_TOKEN: ${{ secrets.GH_PAT_ACTIONS || github.token }}
          AUTO_CREATE_PR: 'true'
          CI: 'true'
          BASE_URL: "http://localhost:5173"
          EXECUTION_ID: "self_healing_e2e_${{ github.run_id }}_${{ github.run_attempt }}"
        run: |
          cd finance-self-healing-framework
          python cli.py --test "${{ github.event.inputs.test_filter }}"

      # ---------------------------------------------------------------------
      # 4. Preservação de Evidências em Caso de Erro
      # ---------------------------------------------------------------------
      - name: 📁 Publicar Artefatos do Playwright no GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: finance-app-test-automation/playwright-report/
          retention-days: 14
          overwrite: true

      - name: 🛡️ Publicar Logs de Execução do Self-Healing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-healing-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: finance-self-healing-framework/logs/
          retention-days: 14
          overwrite: true

  # =========================================================================
  # JOB 2: Build da Imagem Docker e Deploy na AWS (Bloqueado se o Job 1 falhar)
  # =========================================================================
  build-and-deploy:
    name: Build, Push Image & Trigger EC2
    needs: [test-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_API_URL: "/api"
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          docker build \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            --build-arg VITE_GOOGLE_CLIENT_ID="$VITE_GOOGLE_CLIENT_ID" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Trigger EC2 Deploy via AWS SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "cd /home/ubuntu/app",
              "aws ecr get-login-password --region '${AWS_REGION}' | docker login --username AWS --password-stdin '${ECR_REGISTRY}'",
              "docker compose pull frontend",
              "docker compose up -d frontend"
            ]' \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "Comando SSM disparado: $COMMAND_ID. Aguardando execução..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          echo "Deploy do Frontend concluído com sucesso!"
