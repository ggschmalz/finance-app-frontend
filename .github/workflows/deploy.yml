name: Deploy Frontend to Amazon ECR & EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Filtro específico de teste (opcional, ex: auth.spec.ts)'
        required: false
        default: ''

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: finance-app-frontend

permissions:
  contents: write
  pull-requests: write

jobs:
  # =========================================================================
  # JOB 1: Quality Gate E2E com Orquestrador Multiagente de Self-Healing
  # =========================================================================
  test-e2e:
    name: Run E2E Test Suite & Multi-Agent Self-Healing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      auto_merge_pr: ${{ steps.self_healing_e2e.outputs.auto_merge_pr }}
      healed_branch: ${{ steps.self_healing_e2e.outputs.healed_branch }}
      healed_pr_url: ${{ steps.self_healing_e2e.outputs.healed_pr_url }}
      pending_review_count: ${{ steps.self_healing_e2e.outputs.pending_review_count }}

    steps:
      - name: 📥 Checkout Frontend Code
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: 📚 Checkout Product Ground Truth (Base da Verdade)
        uses: actions/checkout@v4
        with:
          repository: ggschmalz/finance-app-product
          token: ${{ secrets.GH_PAT_ACTIONS || github.token }}
          path: finance-app-product

      - name: 🧪 Checkout Test Automation Code
        uses: actions/checkout@v4
        with:
          repository: ggschmalz/finance-app-test-automation
          ref: main
          token: ${{ secrets.GH_PAT_ACTIONS || github.token }}
          path: finance-app-test-automation

      - name: 🤖 Checkout Self-Healing Framework
        uses: actions/checkout@v4
        with:
          repository: ggschmalz/finance-self-healing-framework
          token: ${{ secrets.GH_PAT_ACTIONS || github.token }}
          path: finance-self-healing-framework

      - name: 🐍 Setup Python (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: finance-self-healing-framework/requirements.txt

      - name: 📦 Instalar Dependências do Sistema de Self-Healing
        run: |
          python -m pip install --upgrade pip
          pip install -r finance-self-healing-framework/requirements.txt

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            finance-app-test-automation/package-lock.json

      # ---------------------------------------------------------------------
      # 1. Compilar e Subir o Frontend Localmente
      # ---------------------------------------------------------------------
      - name: 🌐 Subir Servidor de Preview do Frontend
        working-directory: frontend
        env:
          VITE_API_URL: "/api"
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build
          # Sobe o servidor de preview na porta 5173 em segundo plano
          npx vite preview --port 5173 &
          # Aguarda o servidor responder com timeout de 30 segundos
          npx wait-on http://localhost:5173 --timeout 30000

      # ---------------------------------------------------------------------
      # 2. Instalar Playwright e Navegadores
      # ---------------------------------------------------------------------
      - name: 📦 Cache dos Binários do Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('finance-app-test-automation/package-lock.json') }}

      - name: 📦 Instalar Dependências do Playwright
        working-directory: finance-app-test-automation
        run: |
          npm ci
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install-deps chromium
          fi
          echo "🔍 Listagem de Testes E2E Disponíveis:"
          npx playwright test --list

      # ---------------------------------------------------------------------
      # 3. Execução dos Testes com Orquestrador de Self-Healing (Quality Gate)
      # ---------------------------------------------------------------------
      - name: 🚀 Executar Suíte E2E com Orquestrador de Self-Healing
        id: self_healing_e2e
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          SELF_HEALING_MODEL: ${{ secrets.SELF_HEALING_MODEL || 'gemini-3.1-flash-lite' }}
          BASE_DIR: ${{ github.workspace }}
          AUTOMATION_DIR: ${{ github.workspace }}/finance-app-test-automation
          PRODUCT_DIR: ${{ github.workspace }}/finance-app-product
          GITHUB_TOKEN: ${{ secrets.GH_PAT_ACTIONS || github.token }}
          GH_TOKEN: ${{ secrets.GH_PAT_ACTIONS || github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AUTOMATION_REF: ${{ github.head_ref || 'main' }}
          AUTO_CREATE_PR: 'true'
          CI: 'true'
          BASE_URL: "http://localhost:5173"
          EXECUTION_ID: "self_healing_e2e_${{ github.run_id }}_${{ github.run_attempt }}"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cd finance-self-healing-framework
          TEST_ARG=""
          if [ -n "${{ github.event.inputs.test_filter }}" ]; then
            TEST_ARG="--test ${{ github.event.inputs.test_filter }}"
          fi
          python cli.py $TEST_ARG

      # ---------------------------------------------------------------------
      # 4. Preservação de Evidências em Caso de Erro
      # ---------------------------------------------------------------------
      - name: 📁 Publicar Artefatos do Playwright no GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: finance-app-test-automation/playwright-report/
          retention-days: 14
          overwrite: true

      - name: 🛡️ Publicar Logs de Execução do Self-Healing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-healing-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: finance-self-healing-framework/logs/
          retention-days: 14
          overwrite: true

  # =========================================================================
  # JOB 2: Build da Imagem Docker e Deploy na AWS (Bloqueado se o Job 1 falhar)
  # =========================================================================
  build-and-deploy:
    name: Build, Push Image & Trigger EC2
    needs: [test-e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_API_URL: "/api"
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          docker build \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            --build-arg VITE_GOOGLE_CLIENT_ID="$VITE_GOOGLE_CLIENT_ID" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Trigger EC2 Deploy via AWS SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "cd /home/ubuntu/app",
              "aws ecr get-login-password --region '${AWS_REGION}' | docker login --username AWS --password-stdin '${ECR_REGISTRY}'",
              "docker compose pull frontend",
              "docker compose up -d frontend"
            ]' \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "Comando SSM disparado: $COMMAND_ID. Aguardando execução..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          echo "Deploy do Frontend concluído com sucesso!"

  # =========================================================================
  # JOB 3: Auto-Merge de Pull Request de Autocura Validado na Branch Principal
  # Executa ao final da pipeline apenas quando um fix foi feito e validado com
  # 100% de sucesso (auto_merge_pr == 'true'). Scripts pendentes mantêm o PR
  # aberto para revisão manual pelo humano.
  # =========================================================================
  merge-self-healing-pr:
    name: Auto-Merge Validated Self-Healing PR
    needs: [test-e2e, build-and-deploy]
    if: |
      always() &&
      needs.test-e2e.result == 'success' &&
      needs.test-e2e.outputs.auto_merge_pr == 'true' &&
      needs.test-e2e.outputs.healed_branch != '' &&
      (needs.build-and-deploy.result == 'success' || needs.build-and-deploy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: 🧪 Checkout Test Automation Repository
        uses: actions/checkout@v4
        with:
          repository: ggschmalz/finance-app-test-automation
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_ACTIONS || github.token }}

      - name: 🔀 Merge Validated Self-Healing PR into Main
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ACTIONS || github.token }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT_ACTIONS || github.token }}
          HEALED_BRANCH: ${{ needs.test-e2e.outputs.healed_branch }}
          HEALED_PR_URL: ${{ needs.test-e2e.outputs.healed_pr_url }}
        run: |
          echo "🔀 Iniciando auto-merge do Pull Request de autocura validado: $HEALED_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if gh pr merge "$HEALED_BRANCH" --merge --delete-branch; then
            echo "✅ Pull Request mergeado com sucesso na branch main via GitHub CLI!"
          else
            echo "⚠️ Fallback: realizando merge direto da branch '$HEALED_BRANCH' na 'main' via Git..."
            git fetch origin "$HEALED_BRANCH"
            git checkout main
            git pull origin main
            git merge --no-ff "origin/$HEALED_BRANCH" -m "Merge pull request from $HEALED_BRANCH (Auto-Merged by Self-Healing Pipeline)"
            git push origin main
            git push origin --delete "$HEALED_BRANCH" || true
            echo "✅ Branch '$HEALED_BRANCH' integrada com sucesso na branch main!"
          fi

          echo "## 🔀 Auto-Merge de Autocura Concluído" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!TIP]" >> $GITHUB_STEP_SUMMARY
          echo "> O fix gerado pelo Sistema Multiagente de Self-Healing foi validado com 100% de sucesso na suíte E2E e integrado automaticamente na branch \`main\` do repositório de automação." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch Integrada:** \`$HEALED_BRANCH\` ➡️ \`main\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "$HEALED_PR_URL" ]; then
            echo "- **Pull Request:** $HEALED_PR_URL" >> $GITHUB_STEP_SUMMARY
          fi
